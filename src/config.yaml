file_path: './data/data.csv'
target_column: resale_price
val_test_size: 0.2
val_size: 0.5
param_grid:
  regressor__alpha: [0.1, 1, 10, 100, 1000]
  regressor__fit_intercept: [True, False]
lasso_param_grid:
  regressor__regressor__alpha: [0.0001, 0.001, 0.01, 0.1, 1.0]
  regressor__regressor__fit_intercept: [True, False]
cv: 5
scoring: r2
random_state: 42
random_forest_estimators: 20
n_jobs: 1
output_dir: outputs
model_dir: models
numerical_features:
  - floor_area_sqm
  - remaining_lease_months
  - lease_commence_date
  - year
  - age_of_flat
nominal_features:
  - month
  - town_name
  - flatm_name
ordinal_features:
  - flat_type
passthrough_features:
  - storey_range
flat_type_categories:
  - 1 ROOM
  - 2 ROOM
  - 3 ROOM
  - 4 ROOM
  - 5 ROOM
  - MULTI-GENERATION
  - EXECUTIVE